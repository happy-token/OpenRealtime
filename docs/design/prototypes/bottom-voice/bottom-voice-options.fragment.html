<style>
#ort-edge-options{--edge-bg:#111218;--edge-panel:#20212c;--edge-text:#f0f0f5;--edge-muted:#a5a7b8;--edge-border:#343441;font:400 14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--edge-text);color-scheme:dark;width:100%}#ort-edge-options *{box-sizing:border-box}#ort-edge-options button,#ort-edge-options select,#ort-edge-options input{font:inherit}#ort-edge-options button,#ort-edge-options select{background:#252633;border:1px solid #454557;border-radius:9px;color:var(--edge-text);padding:7px 11px;min-height:40px;cursor:pointer}#ort-edge-options button:hover{background:#343344}#ort-edge-options button[aria-pressed=true]{border-color:#c4b5f4;color:#e2d8ff;background:#353044}#ort-edge-options .edge-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--edge-panel);padding:14px 16px;border-radius:12px;margin-bottom:16px}#ort-edge-options .edge-tools label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#ort-edge-options .edge-tools input[type=range]{width:100px;accent-color:#c4b5f4}#ort-edge-options .edge-tools output{color:#c5bed9;min-width:36px;font-variant-numeric:tabular-nums}#ort-edge-options .edge-tools .edge-simulation{color:var(--edge-muted);font-size:12px;margin-left:auto}#ort-edge-options .edge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#ort-edge-options .edge-window{background:var(--edge-bg);border:1px solid var(--edge-border);border-radius:14px;position:relative;overflow:hidden;min-width:0;min-height:270px}#ort-edge-options .edge-window[data-selected=true]{border-color:#9587bd}#ort-edge-options .edge-window header{padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid #252630;background:#181921}#ort-edge-options .edge-title{font-weight:500}#ort-edge-options .edge-title span{font-size:12px;color:var(--edge-muted);margin-left:9px;font-weight:400}#ort-edge-options .edge-window header button{font-size:12px;min-height:36px;padding:5px 10px}#ort-edge-options .edge-content{text-align:center;padding:26px 18px 100px;position:relative;z-index:1;pointer-events:none}#ort-edge-options .edge-caption{font-size:20px;line-height:1.6;margin:0 0 10px;font-weight:400;letter-spacing:-.02em}#ort-edge-options .edge-status{font-size:12px;color:#bcb8d0;display:flex;align-items:center;justify-content:center;gap:7px}#ort-edge-options .edge-status:before{content:"";width:4px;height:4px;background:#b8abf3;border-radius:50%}#ort-edge-options .edge-window canvas{position:absolute;bottom:0;left:0;width:100%;height:95px;pointer-events:none}#ort-edge-options .edge-selection{color:var(--edge-muted);font-size:12px;margin-top:13px;min-height:22px}#ort-edge-options .edge-window[hidden]{display:none!important}#ort-edge-options .edge-grid[data-solo=true]{grid-template-columns:1fr}#ort-edge-options .edge-grid[data-solo=true] .edge-window{min-height:330px}#ort-edge-options .edge-grid[data-solo=true] .edge-content{padding:45px 20px 145px}#ort-edge-options .edge-grid[data-solo=true] .edge-caption{font-size:27px}#ort-edge-options .edge-grid[data-solo=true] canvas{height:120px}@media(max-width:620px){#ort-edge-options .edge-grid{grid-template-columns:1fr;gap:14px}#ort-edge-options .edge-tools{gap:10px;padding:12px}#ort-edge-options .edge-tools .edge-simulation{margin-left:0;flex-basis:100%}#ort-edge-options .edge-title span{display:block;margin-left:0}#ort-edge-options .edge-window header button{min-height:44px}#ort-edge-options .edge-window{min-height:252px}#ort-edge-options .edge-content{padding-top:22px}#ort-edge-options .edge-caption{font-size:19px}}
</style>
<div id="ort-edge-options">
  <div class="edge-tools">
    <label>状态 <select data-role="state"><option value="speaking">AI 说话</option><option value="listening">我说话</option><option value="idle">无声待命</option><option value="thinking">思考中</option><option value="muted">静音</option><option value="error">连接中断</option></select></label>
    <label>音量 <input data-role="volume" type="range" min="0" max="100" value="68" aria-label="四款同步模拟音量"><output data-role="level">68%</output></label>
    <label>查看 <select data-role="view"><option value="all">四款对比</option><option value="ribbon">A · 丝带光束</option><option value="aurora">B · 柔和极光</option><option value="strings">C · 极简弦线</option><option value="pulse">D · 节奏脉冲</option></select></label>
    <span class="edge-simulation">模拟声音 · 同一音量 · 同一底边</span>
  </div>
  <div class="edge-grid" data-solo="false">
    <section class="edge-window" data-style="ribbon" aria-label="方案A 丝带光束"><header><span class="edge-title">A · 丝带光束<span>已保存的方向</span></span><button type="button" data-select="ribbon" aria-pressed="false">选择 A</button></header><div class="edge-content"><p class="edge-caption">让每一次开口，都有回应。</p><div class="edge-status">正在回答</div></div><canvas role="img" aria-label="方案A：多层彩色丝带从底边向上展开">底边彩色丝带</canvas></section>
    <section class="edge-window" data-style="aurora" aria-label="方案B 柔和极光"><header><span class="edge-title">B · 柔和极光<span>柔和、有氛围</span></span><button type="button" data-select="aurora" aria-pressed="false">选择 B</button></header><div class="edge-content"><p class="edge-caption">让每一次开口，都有回应。</p><div class="edge-status">正在回答</div></div><canvas role="img" aria-label="方案B：彩色极光由底边向上柔和扩散">底边柔和极光</canvas></section>
    <section class="edge-window" data-style="strings" aria-label="方案C 极简弦线"><header><span class="edge-title">C · 极简弦线<span>克制、适合长聊</span></span><button type="button" data-select="strings" aria-pressed="false">选择 C</button></header><div class="edge-content"><p class="edge-caption">让每一次开口，都有回应。</p><div class="edge-status">正在回答</div></div><canvas role="img" aria-label="方案C：几条纤细声线沿底边轻轻起伏">底边极简弦线</canvas></section>
    <section class="edge-window" data-style="pulse" aria-label="方案D 节奏脉冲"><header><span class="edge-title">D · 节奏脉冲<span>节奏清楚、反馈直接</span></span><button type="button" data-select="pulse" aria-pressed="false">选择 D</button></header><div class="edge-content"><p class="edge-caption">让每一次开口，都有回应。</p><div class="edge-status">正在回答</div></div><canvas role="img" aria-label="方案D：短光柱从底边随模拟音量升降，并非实际频谱">底边节奏脉冲</canvas></section>
  </div>
  <div class="edge-selection" data-role="selection" role="status">尚未选择 · 可先切换静音、思考与音量比较</div>
</div>
<script>
(()=>{
const root=document.getElementById('ort-edge-options');if(!root)return;
const $=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const model={state:'speaking',volume:68,view:'all',selected:'',height:72,speed:.82};
const names={ribbon:'A · 丝带光束',aurora:'B · 柔和极光',strings:'C · 极简弦线',pulse:'D · 节奏脉冲'};
const captions={speaking:'让每一次开口，都有回应。',listening:'我想把语音体验做得更好…',idle:'我在听。',thinking:'正在组织回复…',muted:'麦克风已关闭',error:'连接中断，正在尝试恢复…'};
const statuses={speaking:'正在回答',listening:'正在听你说',idle:'等待你开口',thinking:'思考中 · 无语音输出',muted:'可用文字继续',error:'记录与草稿已保留'};
const views=all('.edge-window').map(el=>({el,canvas:el.querySelector('canvas'),ctx:el.querySelector('canvas').getContext('2d'),style:el.dataset.style,width:0,height:0}));
let level=.68,time=.3,last=0,frameId=0,visible=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function target(){return ['speaking','listening'].includes(model.state)?model.volume/100:0;}
function render(){
$('[data-role=state]').value=model.state;$('[data-role=volume]').value=model.volume;$('[data-role=level]').textContent=model.volume+'%';$('[data-role=volume]').disabled=!['speaking','listening'].includes(model.state);$('[data-role=view]').value=model.view;$('.edge-grid').dataset.solo=String(model.view!=='all');
for(const v of views){v.el.hidden=model.view!=='all'&&model.view!==v.style;v.el.dataset.selected=String(model.selected===v.style);v.el.querySelector('.edge-caption').textContent=captions[model.state];v.el.querySelector('.edge-status').textContent=statuses[model.state];const b=v.el.querySelector('button');b.setAttribute('aria-pressed',String(model.selected===v.style));b.textContent=(model.selected===v.style?'已选 ':'选择 ')+names[v.style][0];}
$('[data-role=selection]').textContent=model.selected?'当前偏好：'+names[model.selected]+' · 仅选择设计方向，尚未应用到产品':'尚未选择 · 可先切换静音、思考与音量比较';
if(reduced.matches)level=target();draw();schedule();
}
$('[data-role=state]').addEventListener('change',e=>{model.state=e.target.value;render();});$('[data-role=volume]').addEventListener('input',e=>{model.volume=Number(e.target.value);render();});$('[data-role=view]').addEventListener('change',e=>{model.view=e.target.value;render();});
root.addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(!b)return;model.selected=b.dataset.select;render();});
function gradient(ctx,w,alpha=1){const g=ctx.createLinearGradient(0,0,w,0);const colors=model.state==='listening'?['130,244,255','142,108,255','130,244,255']:['255,216,107','130,244,255','255,123,213','142,108,255'];g.addColorStop(0,'rgba(142,108,255,0)');colors.forEach((c,i)=>g.addColorStop(.14+.72*i/(colors.length-1),'rgba('+c+','+alpha+')'));g.addColorStop(1,'rgba(142,108,255,0)');return g;}
function base(ctx,w,h){ctx.globalCompositeOperation='source-over';ctx.strokeStyle=model.state==='muted'?'#81808c':model.state==='error'?'#d4a67d':gradient(ctx,w,.72);ctx.lineWidth=1.5;ctx.beginPath();if(model.state==='error')ctx.setLineDash([13,8]);ctx.moveTo(0,h-1);ctx.lineTo(w,h-1);ctx.stroke();ctx.setLineDash([]);}
function quiet(ctx,w,h){base(ctx,w,h);if(model.state==='thinking'){const x=(Math.sin(time*.7)*.5+.5)*w;const g=ctx.createLinearGradient(x-w*.2,0,x+w*.2,0);g.addColorStop(0,'#cbd7ff00');g.addColorStop(.5,'#e9dfff');g.addColorStop(1,'#cbd7ff00');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.shadowColor='#ad91f7';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(Math.max(0,x-w*.2),h-1);ctx.lineTo(Math.min(w,x+w*.2),h-1);ctx.stroke();ctx.shadowBlur=0;}}
function ribbon(ctx,w,h,amp,t){const cy=h-1,phase=t*2.4;const env=x=>Math.pow(Math.cos(Math.PI*x/2),2),main=x=>cy-amp*env(x)*(.52+.48*Math.sin(x*1.1+phase));const colors=['#FFD86B','#FF7BD5','#82F4FF','#8E6CFF'],offsets=[-2.77,-.94,.94,2.77];ctx.globalCompositeOperation='screen';for(let k=0;k<4;k++){const p=new Path2D();for(let i=0;i<=120;i++){const x=i/60-1,px=(x+1)*w/2;i?p.lineTo(px,main(x)):p.moveTo(px,main(x));}for(let i=120;i>=0;i--){const x=i/60-1;p.lineTo((x+1)*w/2,cy-amp*1.14*env(x)*(.52+.48*Math.sin(x+phase+offsets[k])));}p.closePath();const g=ctx.createLinearGradient(0,cy-amp,0,cy+amp);g.addColorStop(0,colors[k]+'08');g.addColorStop(.4,colors[k]+'70');g.addColorStop(.6,colors[k]+'58');g.addColorStop(1,colors[k]+'05');ctx.fillStyle=g;ctx.shadowColor=colors[k];ctx.shadowBlur=18;ctx.fill(p);ctx.shadowBlur=0;ctx.strokeStyle=colors[k]+'85';ctx.lineWidth=.8;ctx.stroke(p);}const p=new Path2D();for(let i=0;i<=120;i++){const x=i/60-1;i?p.lineTo((x+1)*w/2,main(x)):p.moveTo((x+1)*w/2,main(x));}ctx.strokeStyle=gradient(ctx,w,.9);ctx.lineWidth=1.8;ctx.shadowColor='#c9f9ff';ctx.shadowBlur=9;ctx.stroke(p);ctx.shadowBlur=0;}
function aurora(ctx,w,h,amp,t){ctx.globalCompositeOperation='screen';const colors=['#8E6CFF','#82F4FF','#FF7BD5','#FFD86B'];for(let k=0;k<4;k++){const cx=w*(.18+k*.21+.07*Math.sin(t*.62+k)),spread=w*(.19+.03*Math.cos(t*.4+k));const p=new Path2D();p.moveTo(0,h);for(let x=0;x<=w+4;x+=4){const z=(x-cx)/spread;const envelope=Math.exp(-z*z*1.8);const height=amp*(.55+.4*Math.pow(Math.sin(t*.8+k),2))*envelope;const y=h-1-height*(.8+.2*Math.sin(x/w*5+t+k));p.lineTo(x,y);}p.lineTo(w,h);p.closePath();const g=ctx.createLinearGradient(0,h-amp,0,h);g.addColorStop(0,colors[k]+'00');g.addColorStop(.35,colors[k]+'0c');g.addColorStop(.76,colors[k]+'45');g.addColorStop(1,colors[k]+'c0');ctx.fillStyle=g;ctx.shadowColor=colors[k];ctx.shadowBlur=22;ctx.fill(p);ctx.shadowBlur=0;}}
function strings(ctx,w,h,amp,t){ctx.globalCompositeOperation='screen';const colors=['#b8a5ff','#82f4ff','#f1e7ff'];for(let k=0;k<3;k++){const p=new Path2D();for(let i=0;i<=140;i++){const x=i/140,env=Math.pow(Math.sin(Math.PI*x),2);const y=h-1-amp*.72*env*(.12+.88*Math.pow(Math.sin(x*4.2-t*1.8+k*.8),2));i?p.lineTo(x*w,y):p.moveTo(x*w,y);}ctx.strokeStyle=colors[k];ctx.globalAlpha=.35+k*.22;ctx.lineWidth=k===2?1.3:.8;ctx.shadowColor=colors[k];ctx.shadowBlur=k===2?8:4;ctx.stroke(p);}ctx.globalAlpha=1;ctx.shadowBlur=0;}
function pulse(ctx,w,h,amp,t){ctx.globalCompositeOperation='screen';const n=Math.max(24,Math.floor(w/7));const gap=w/n;ctx.fillStyle=gradient(ctx,w,.9);for(let i=0;i<n;i++){const x=(i+.5)/n,env=Math.pow(Math.sin(Math.PI*x),1.15);const rhythm=.12+.48*Math.pow(Math.sin(i*.37-t*3.2),2)+.4*Math.pow(Math.sin(i*.19+t*1.9),4);const height=Math.max(1.5,amp*env*rhythm*.86);ctx.beginPath();ctx.roundRect(i*gap+gap*.24,h-height,gap*.5,height,Math.min(1.4,height/2));ctx.fill();}}
function draw(){for(const v of views){if(v.el.hidden||!v.ctx)continue;const r=v.canvas.getBoundingClientRect();if(!r.width||!r.height)continue;const ctx=v.ctx,dpr=Math.min(devicePixelRatio||1,2),w=r.width,h=r.height;if(v.canvas.width!==Math.round(w*dpr)||v.canvas.height!==Math.round(h*dpr)){v.canvas.width=Math.round(w*dpr);v.canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';const amp=Math.min(model.height,h*.78)*Math.pow(Math.max(0,level),.72);if(amp<.3){quiet(ctx,w,h);continue;}({ribbon,aurora,strings,pulse}[v.style])(ctx,w,h,amp,time);base(ctx,w,h);}}
function schedule(){if(!frameId&&visible&&!document.hidden&&!reduced.matches)frameId=requestAnimationFrame(frame);}
function frame(now){frameId=0;if(!root.isConnected)return;const dt=Math.min((now-(last||now))/1000,.05);last=now;const desired=target();level+=(desired-level)*(1-Math.exp(-dt/(desired>level?.075:.23)));time+=dt*(desired>0?model.speed:.3);draw();if(target()>0||level>.001||model.state==='thinking')schedule();}
const ro=new ResizeObserver(()=>{draw();schedule();});views.forEach(v=>ro.observe(v.canvas));const io=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible){last=0;schedule();}else if(frameId){cancelAnimationFrame(frameId);frameId=0;}});io.observe(root);document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden&&frameId){cancelAnimationFrame(frameId);frameId=0;}else schedule();});reduced.addEventListener('change',()=>{if(frameId){cancelAnimationFrame(frameId);frameId=0;}render();});render();
if(globalThis.Tweak){const tweak=new Tweak({container:$('.edge-grid'),onChange:render});tweak.addSlider(model,'height',{label:'共同最大振幅',min:24,max:82,unit:'px'});tweak.addSlider(model,'speed',{label:'共同流动速度',min:.2,max:1.6,step:.05});}
})();
</script>
