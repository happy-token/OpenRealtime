  <style>

    .footnote { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 15px 3px 0; font-size: 11px; color: var(--text-faint); }
    .footnote span { color: var(--text-dim); }
    .footnote a { color: var(--text-faint); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
    .ended { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; text-align: center; background: color-mix(in srgb, var(--bg-soft) 92%, transparent); backdrop-filter: blur(12px); }
    .ended h2 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
    .ended p { font-size: 12px; color: var(--text-faint); }
    #restart { margin: 16px auto 0; border: 1px solid var(--border-strong); border-radius: 14px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 10px 22px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @keyframes breathe { 50% { transform: translateY(-7px) scale(1.025); } }
    @keyframes wave { 50% { transform: scaleY(.4); } }
    @media (max-width: 700px) {
      .page { padding: 0 12px 16px; }
      .topbar { min-height: 78px; gap: 10px; }
      .prototype-label, .theme-label { display: none; }
      .brand strong { font-size: 13px; }
      .brand-mark { width: 26px; height: 26px; }
      .header-actions { gap: 6px; }
      select { width: 108px; font-size: 11px; }
      .stage { height: max(650px, calc(100dvh - 152px)); border-radius: 22px; }
      .stage-header { top: 17px; left: 16px; right: 16px; align-items: flex-start; }
      .session-label { padding-top: 10px; font-size: 10px; gap: 6px; }
      .mode-tabs button { padding: 5px 10px; }
      .scene { inset: 85px 20px 235px; gap: 14px; }
      .stage[data-mode="sidecar"] .scene { grid-template-columns: minmax(0, 1fr) 90px; }
      .stage[data-mode="sidecar"] .presence { padding: 0; align-self: start; margin-top: 48px; }
      .stage[data-mode="sidecar"] .orb { width: 80px; margin-bottom: 15px; }
      .stage[data-mode="sidecar"] .presence strong { font-size: 12px; }
      .stage[data-mode="sidecar"] .presence p, .stage[data-mode="sidecar"] .wave { display: none; }
      .conversation h1 { font-size: 20px; }
      .message p, .message.user p { font-size: 13px; }
      .messages { height: 260px; padding-right: 4px; }
      .stage[data-mode="content"] .presence { right: 0; bottom: -5px; width: 72px; }
      .stage[data-mode="content"] .messages { padding-right: 88px; }
      .stage[data-mode="fullscreen"] .scene { inset: 75px 10px 235px; }
      .stage[data-mode="fullscreen"] .orb { width: 184px; }
      .dock { bottom: 25px; width: calc(100% - 16px); padding: 8px; gap: 8px; min-height: 66px; border-radius: 23px; }
      .icon-button { width: 44px; min-width: 44px; height: 44px; }
      .main-actions { width: 148px; }
      .fullscreen-tools { width: 96px; }
      .dock[data-expanded="true"] .fullscreen-tools { width: 44px; }
      .toolbar::before { margin-right: 0; height: 28px; }
      .input-surface { min-height: 48px; padding-left: 12px; gap: 5px; }
      textarea { font-size: 12px; }
      #send { height: 38px; padding: 0 10px; gap: 4px; font-size: 11px; }
      #send svg { width: 15px; height: 15px; }
      .tip::after { max-width: 160px; }
      .footnote { display: block; padding-top: 12px; font-size: 10px; }
      .footnote > :last-child { display: block; margin-top: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

<body data-theme="dracula" data-color-scheme="dark">
  <svg class="symbols" aria-hidden="true"><defs>

  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-brand"/></svg></span><div><strong>OpenRealtime</strong><small>会话操作条 · 交互预览</small></div></div>
      <div class="header-actions"><span class="prototype-label">HTML 原型 · 模拟对话</span><label class="theme-label" for="theme">主题</label><select id="theme" aria-label="演示主题"><option value="dracula">Dracula</option><option value="catppuccin">Catppuccin</option><option value="tokyo-night">Tokyo Night</option><option value="rose-pine">Rosé Pine</option><option value="kanagawa">Kanagawa</option><option value="duskfox">Duskfox</option><option value="onedark">OneDark</option><option value="night-owl">Night Owl</option><option value="nord">Nord</option></select></div>
    </header>
    <main class="stage" id="stage" data-mode="sidecar" data-muted="false">
      <header class="stage-header"><div class="session-label" id="session-status" data-muted="false"><i class="dot"></i><span id="status-text">语音会话预览</span></div><nav class="mode-tabs" aria-label="页面模式"><button data-mode="fullscreen" aria-pressed="false">全屏</button><button data-mode="sidecar" aria-pressed="true">并排</button><button data-mode="content" aria-pressed="false">内容</button></nav></header>
      <div class="scene">
        <section class="conversation" aria-label="模拟对话"><h1>把想法，慢慢说清楚。</h1><p>若水 · 你的语音伙伴</p><div class="messages" id="messages" aria-live="polite"><article class="message user"><small>你</small><p>帮我整理一下今天的工作安排。</p></article><article class="message"><small>若水</small><p>当然。先把最重要的事情告诉我，我们一起排出一个轻松、清晰的节奏。</p></article></div></section>
        <div class="presence" aria-hidden="true"><div class="orb"></div><strong>若水</strong><p>认真听你说</p><div class="wave"><i style="--h:6px;--n:1"></i><i style="--h:11px;--n:2"></i><i style="--h:17px;--n:3"></i><i style="--h:10px;--n:4"></i><i style="--h:18px;--n:5"></i><i style="--h:14px;--n:6"></i><i style="--h:7px;--n:7"></i></div></div>
      </div>
      <p class="caption" id="caption" hidden>先把最重要的事情告诉我，我们一起安排。</p>
      <section class="dock" id="dock" data-expanded="false" aria-label="会话操作">
        <form class="composer" id="composer" aria-label="文字输入">
          <div class="input-surface"><textarea id="message" aria-label="输入对话消息" placeholder="输入文字…" rows="1" maxlength="2000"></textarea><button type="submit" id="send" disabled><svg><use href="#i-send"/></svg>发送</button></div>
        </form>
        <div class="toolbar">
          <div class="fullscreen-tools" id="fullscreen-tools" hidden>
            <button class="icon-button tip" id="input-toggle" aria-expanded="false" aria-controls="composer" aria-label="展开文字输入" data-tip="展开文字输入"><svg><use href="#i-keyboard"/></svg><span id="input-label" class="sr-only">文字输入</span></button>
            <button class="icon-button tip" id="captions" aria-label="隐藏字幕" aria-pressed="true" data-tip="隐藏字幕"><svg><use href="#i-caption"/></svg></button>
          </div>
          <div class="main-actions" id="main-actions">
            <button class="icon-button tip" id="mic" aria-label="关闭麦克风" aria-pressed="true" data-tip="关闭麦克风"><svg><use href="#i-mic"/></svg></button>
            <button class="icon-button tip" id="mode" aria-label="切换页面模式" aria-expanded="false" aria-controls="controls-popover" data-tip="切换页面模式"><svg><use href="#i-layout"/></svg></button>
            <button class="icon-button tip" id="end" aria-label="结束预览" data-tip="挂断"><svg><use href="#i-phone"/></svg></button>
          </div>
          <button class="icon-button tip" id="more" aria-label="展开通话操作" aria-expanded="false" aria-controls="controls-popover" data-tip="展开通话操作" hidden><svg><use href="#i-more"/></svg></button>
        </div>
        <section class="popover" id="controls-popover" aria-label="更多通话操作面板" hidden>
          <h2>通话操作</h2><button class="menu-action" id="menu-mic"><svg><use href="#i-mic"/></svg><span>关闭麦克风</span></button>
          <button class="menu-action" id="menu-captions" hidden><svg><use href="#i-caption"/></svg><span>隐藏字幕</span></button>
          <div class="menu-modes"><p>页面模式</p><div role="radiogroup" aria-label="切换页面模式"><button role="radio" data-mode="fullscreen" aria-checked="false">全屏</button><button role="radio" data-mode="sidecar" aria-checked="true">并排</button><button role="radio" data-mode="content" aria-checked="false">内容</button></div></div>
          <button class="menu-action" id="menu-end"><svg><use href="#i-phone"/></svg><span>结束预览</span></button>
        </section>
      </section>
      <section class="ended" id="ended" hidden role="dialog" aria-modal="true" aria-labelledby="ended-title"><h2 id="ended-title">预览已结束</h2><p>这只是交互演示，没有开启真实麦克风。</p><button id="restart">重新体验</button></section>
    </main>
    <footer class="footnote"><div><span id="interaction-note">并排与内容模式直接输入；全屏点击键盘按钮展开。</span></div><div>全屏输入展开时，三个通话按钮一起收拢　·　<a href="https://m3.material.io/styles/motion" target="_blank" rel="noreferrer">动效参考</a></div></footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </div>
  <script>
    (() => {
      const el = (id) => document.getElementById(id);
      const stage = el('stage'), dock = el('dock'), composer = el('composer');
      const input = el('message'), toggle = el('input-toggle'), more = el('more');
      const mic = el('mic'), mode = el('mode'), popover = el('controls-popover');
      const state = { mode: 'sidecar', expanded: false, muted: false, captions: true, ended: false };
      const themes = Array.from(el('theme').options, option => option.value);
      let focusFrame = 0;
      let popoverTrigger = null;
      try {
        const saved = localStorage.getItem('openrealtime-app-theme');
        if (themes.includes(saved)) document.body.dataset.theme = saved;
      } catch { /* Standalone previews also work without storage. */ }
      el('theme').value = document.body.dataset.theme;
      el('theme').addEventListener('change', event => { document.body.dataset.theme = event.target.value; });

      function icon(button, name) { button.querySelector('use').setAttribute('href', '#i-' + name); }
      function closePopover(restoreFocus = false) {
        popover.hidden = true;
        more.setAttribute('aria-expanded', 'false');
        mode.setAttribute('aria-expanded', 'false');
        if (restoreFocus && popoverTrigger) {
          if (!popoverTrigger.hidden && !popoverTrigger.closest('[inert]')) popoverTrigger.focus();
          else mode.focus();
        }
        popoverTrigger = null;
      }
      function openPopover(trigger) {
        if (!popover.hidden) { closePopover(true); return; }
        popover.hidden = false;
        popoverTrigger = trigger;
        trigger.setAttribute('aria-expanded', 'true');
        el('menu-mic').focus();
      }
      function render() {
        stage.dataset.mode = state.mode;
        stage.dataset.muted = String(state.muted);
        if (state.mode !== 'fullscreen') state.expanded = false;
        dock.dataset.expanded = String(state.expanded);
        const showComposer = state.mode !== 'fullscreen' || state.expanded;
        composer.inert = !showComposer;
        el('main-actions').inert = state.expanded;
        el('main-actions').setAttribute('aria-hidden', String(state.expanded));
        el('fullscreen-tools').hidden = state.mode !== 'fullscreen';
        more.hidden = !state.expanded;
        toggle.setAttribute('aria-expanded', String(state.expanded));
        toggle.setAttribute('aria-label', state.expanded ? '收起文字输入' : '展开文字输入');
        toggle.dataset.tip = state.expanded ? '收起文字输入' : '展开文字输入';
        el('input-label').textContent = state.expanded ? '收起输入' : input.value ? '继续输入' : '文字输入';
        icon(toggle, state.expanded ? 'chevron' : 'keyboard');
        mic.setAttribute('aria-pressed', String(!state.muted));
        const micLabel = state.muted ? '开启麦克风' : '关闭麦克风';
        mic.setAttribute('aria-label', micLabel);
        mic.dataset.tip = micLabel;
        icon(mic, state.muted ? 'muted' : 'mic');
        icon(el('menu-mic'), state.muted ? 'muted' : 'mic');
        el('menu-mic').querySelector('span').textContent = micLabel;
        el('session-status').dataset.muted = String(state.muted);
        el('status-text').textContent = state.muted ? '麦克风已关闭 · 预览' : '语音会话预览';
        el('captions').hidden = state.mode !== 'fullscreen' || state.expanded;
        el('menu-captions').hidden = state.mode !== 'fullscreen';
        const captionLabel = state.captions ? '隐藏字幕' : '显示字幕';
        el('captions').setAttribute('aria-label', captionLabel);
        el('captions').dataset.tip = captionLabel;
        el('captions').setAttribute('aria-pressed', String(state.captions));
        el('menu-captions').querySelector('span').textContent = captionLabel;
        el('caption').hidden = state.mode !== 'fullscreen' || !state.captions;
        document.querySelectorAll('[data-mode]').forEach(button => {
          if (button.tagName !== 'BUTTON') return;
          button.setAttribute(button.getAttribute('role') === 'radio' ? 'aria-checked' : 'aria-pressed', String(button.dataset.mode === state.mode));
          if (button.getAttribute('role') === 'radio') button.tabIndex = button.dataset.mode === state.mode ? 0 : -1;
        });
        el('send').disabled = !input.value.trim() || state.ended;
        el('interaction-note').textContent = state.mode !== 'fullscreen' ? '输入框直接显示 · Enter 发送 · Shift + Enter 换行' : state.expanded ? '点击收起按钮或按 Esc，恢复三个通话按钮；草稿保留。' : '点击键盘按钮展开输入框；字幕按钮仅在全屏显示。';
      }
      function setExpanded(expanded) {
        if (state.mode !== 'fullscreen') return;
        cancelAnimationFrame(focusFrame);
        closePopover();
        state.expanded = expanded;
        render();
        if (expanded) focusFrame = requestAnimationFrame(() => { if (state.expanded && !state.ended) input.focus(); });
        else toggle.focus();
      }
      function setMode(nextMode) {
        cancelAnimationFrame(focusFrame);
        closePopover();
        if (state.mode !== nextMode) state.expanded = false;
        state.mode = nextMode;
        render();
        if (state.expanded) input.focus();
        else mode.focus();
        el('announcement').textContent = '已切换为' + ({ fullscreen: '全屏', sidecar: '并排', content: '内容' })[nextMode] + '模式';
      }
      toggle.addEventListener('click', () => setExpanded(!state.expanded));
      more.addEventListener('click', () => openPopover(more));
      mode.addEventListener('click', () => openPopover(mode));
      [mic, el('menu-mic')].forEach(button => button.addEventListener('click', () => {
        state.muted = !state.muted;
        render();
      }));
      [el('captions'), el('menu-captions')].forEach(button => button.addEventListener('click', () => {
        state.captions = !state.captions;
        render();
      }));
      document.querySelectorAll('button[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
      document.querySelector('[role="radiogroup"]').addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const buttons = Array.from(event.currentTarget.querySelectorAll('[role="radio"]'));
        const current = buttons.indexOf(document.activeElement);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 :
          (current + (['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1) + buttons.length) % buttons.length;
        cancelAnimationFrame(focusFrame);
        if (state.mode !== buttons[next].dataset.mode) state.expanded = false;
        state.mode = buttons[next].dataset.mode;
        render();
        buttons[next].focus();
      });
      input.addEventListener('input', () => {
        render();
        input.style.height = '24px';
        input.style.height = Math.min(input.scrollHeight, 72) + 'px';
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); composer.requestSubmit(); }
      });
      function addMessage(text, user) {
        const article = document.createElement('article');
        article.className = 'message' + (user ? ' user' : '');
        const label = document.createElement('small');
        label.textContent = user ? '你' : '若水 · 演示回复';
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        article.append(label, paragraph);
        el('messages').append(article);
      }
      composer.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || state.ended) return;
        addMessage(text, true);
        addMessage('收到你的补充。我们把它一起加入刚才的安排。', false);
        el('caption').textContent = '收到你的补充。我们把它一起加入刚才的安排。';
        input.value = '';
        input.style.height = '24px';
        if (state.mode === 'fullscreen') setExpanded(false);
        else { render(); input.focus(); }
        el('messages').scrollTop = el('messages').scrollHeight;
        el('announcement').textContent = state.mode === 'fullscreen' ? '演示消息已发送，输入框已收起' : '演示消息已发送，可以继续输入';
      });
      document.addEventListener('pointerdown', event => {
        if (!popover.hidden && !popover.contains(event.target) && !more.contains(event.target) && !mode.contains(event.target)) closePopover();
      });
      document.addEventListener('keydown', event => {
        if (state.ended) {
          if (event.key === 'Tab') { event.preventDefault(); el('restart').focus(); }
          return;
        }
        if (event.key !== 'Escape') return;
        if (!popover.hidden) { event.preventDefault(); closePopover(true); }
        else if (state.expanded) { event.preventDefault(); setExpanded(false); }
      });
      function endPreview() {
        cancelAnimationFrame(focusFrame);
        closePopover();
        state.ended = true;
        dock.inert = true;
        document.querySelector('.scene').inert = true;
        document.querySelector('.stage-header').inert = true;
        document.querySelector('.topbar').inert = true;
        document.querySelector('.footnote').inert = true;
        el('ended').hidden = false;
        el('restart').focus();
      }
      [el('end'), el('menu-end')].forEach(button => button.addEventListener('click', endPreview));
      el('restart').addEventListener('click', () => {
        state.ended = false;
        dock.inert = false;
        document.querySelector('.scene').inert = false;
        document.querySelector('.stage-header').inert = false;
        document.querySelector('.topbar').inert = false;
        document.querySelector('.footnote').inert = false;
        el('ended').hidden = true;
        if (state.mode === 'fullscreen') setExpanded(false);
        else { render(); mode.focus(); }
      });
      render();
    })();
  </script>
