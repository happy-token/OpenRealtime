[project]
name = "openrealtime"
version = "0.3.0"
description = "A universal, extensible voice-interaction agent framework"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "OpenRealtime Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "silero-vad>=6.2,<7",
    "websockets>=13.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2,<0.8"]
postgres = [
    "asyncpg>=0.30",
    "cryptography>=43",
]
object-store = [
    "boto3>=1.35,<2",
]
firered = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.22,<2",
    "transformers>=4.55,<5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.build-backend]
module-name = "server"
module-root = ""

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/happy-token/OpenRealtime"
Repository = "https://github.com/happy-token/OpenRealtime"
